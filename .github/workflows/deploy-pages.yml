name: Deploy offline app to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Typecheck test sources
        run: pnpm run typecheck:tests
      - name: Check dependency advisories
        run: pnpm audit --audit-level high
      - name: Run automated tests
        run: pnpm run test
      - name: Build offline PWA
        run: pnpm --filter @workspace/anchor run build
        env:
          BASE_PATH: /substance-recovery
          ANCHOR_BUILD_ID: ${{ github.sha }}
      - name: Add SPA fallback
        run: cp artifacts/anchor/dist/public/index.html artifacts/anchor/dist/public/404.html
      - name: Verify GitHub Pages and offline artifact
        run: pnpm run verify:pwa
      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser flows against production PWA
        run: pnpm exec playwright test
        env:
          BASE_PATH: /substance-recovery
      - name: Save browser test evidence
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/anchor/dist/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
